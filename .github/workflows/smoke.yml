name: tldh - Emulator share smoke test

# Shares an audio file into the debug build on emulators (Android 14-16), the way WhatsApp does,
# and reports crashes, screen text and foreground-service state in the job log.
on:
  workflow_dispatch:
  push:
    branches: [ 'ccr-**' ]
    paths-ignore:
      - 'stt-bench/**'
      - '.github/workflows/stt-bench.yml'

jobs:
  smoke:
    name: Share smoke (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # x86_64 images from API 34 run arm64 apps (whisper-cli) via native bridge; API 33 cannot.
        api: [ 34, 35, 36 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK packages and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "emulator"

      - name: Cache whisper.cpp Android build
        uses: actions/cache@v4
        with:
          path: |
            app/build/whisper-native/jniLibs
            app/build/whisper-native/work/stamp
          key: whisper-native-${{ hashFiles('scripts/build-whisper-android.sh') }}

      - name: Build debug APK
        run: bash scripts/gradle.sh assembleDebug

      - name: Test audio and model
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The test audio is committed (6 s sine, Ogg/Opus), so the job needs no apt mirror.
          cp .github/smoke/smoke-audio.ogg smoke-audio.ogg
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o ggml-base-q5_1.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin"
          ls -la smoke-audio.ogg ggml-base-q5_1.bin app/build/outputs/apk/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run share smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke/share-smoke.sh "$(ls app/build/outputs/apk/debug/*.apk | head -1)"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-${{ matrix.api }}
          path: smoke-out/
          if-no-files-found: ignore

  e2e:
    name: Full transcription e2e (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [ 34, 35 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK packages and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "emulator"

      - name: Cache whisper.cpp Android build
        uses: actions/cache@v4
        with:
          path: |
            app/build/whisper-native/jniLibs
            app/build/whisper-native/work/stamp
          key: whisper-native-${{ hashFiles('scripts/build-whisper-android.sh') }}

      # Test-only: an x86_64 whisper-cli in the debug source set, so the x86_64 emulator runs the
      # real pipeline at native speed. Never committed, never part of a release build.
      - name: Build whisper-cli for the x86_64 emulator
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --quiet --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp /tmp/whisper-x86
          cmake -S /tmp/whisper-x86 -B /tmp/whisper-x86/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CCACHE=OFF \
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF >/dev/null
          cmake --build /tmp/whisper-x86/build --target whisper-cli -j "$(nproc)" >/dev/null
          install -D -m 0755 /tmp/whisper-x86/build/bin/whisper-cli app/src/debug/jniLibs/x86_64/libwhisper_cli.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all app/src/debug/jniLibs/x86_64/libwhisper_cli.so
          ls -la app/src/debug/jniLibs/x86_64/

      - name: Build debug APK
        run: bash scripts/gradle.sh assembleDebug

      - name: German speech sample and model
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Committed: voice-note-de.txt read by espeak-ng 1.51 (-v de -s 150), Ogg/Opus 16 kHz mono
          # 24 kbit/s, 2:38 min. Generated once so the job needs no apt mirror (mirrors stalled in CI).
          cp .github/smoke/e2e-audio.ogg e2e-audio.ogg
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o ggml-base-q5_1.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end transcription on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke/e2e-transcribe.sh "$(ls app/build/outputs/apk/debug/*.apk | head -1)"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-${{ matrix.api }}
          path: e2e-out/
          if-no-files-found: ignore

  ui-stress:
    name: Result screen stress test (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK packages and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "emulator"

      - name: Cache whisper.cpp Android build
        uses: actions/cache@v4
        with:
          path: |
            app/build/whisper-native/jniLibs
            app/build/whisper-native/work/stamp
          key: whisper-native-${{ hashFiles('scripts/build-whisper-android.sh') }}

      - name: Build app and test APKs
        run: bash scripts/gradle.sh assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            bash scripts/gradle.sh connectedDebugAndroidTest || (adb logcat -d -s TldhStress:I AndroidRuntime:E TestRunner:I | tail -80; exit 1)
            adb logcat -d -s TldhStress:I | tail -20
