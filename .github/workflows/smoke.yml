name: tldh - Emulator share smoke test

# Shares an audio file into the debug build on emulators (Android 13-15), the way WhatsApp does,
# and reports crashes, screen text and foreground-service state in the job log.
on:
  workflow_dispatch:
  push:
    branches: [ 'ccr-**' ]
    paths-ignore:
      - 'stt-bench/**'
      - '.github/workflows/stt-bench.yml'

jobs:
  smoke:
    name: Share smoke (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [ 33, 34, 35 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK packages and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "emulator"

      - name: Cache whisper.cpp Android build
        uses: actions/cache@v4
        with:
          path: |
            app/build/whisper-native/jniLibs
            app/build/whisper-native/work/stamp
          key: whisper-native-${{ hashFiles('scripts/build-whisper-android.sh') }}

      - name: Build debug APK
        run: bash scripts/gradle.sh assembleDebug

      - name: Test audio and model
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=6" -c:a libopus -b:a 24k smoke-audio.ogg
          curl -fsSL -o ggml-base-q5_1.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin"
          ls -la smoke-audio.ogg ggml-base-q5_1.bin app/build/outputs/apk/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run share smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke/share-smoke.sh "$(ls app/build/outputs/apk/debug/*.apk | head -1)"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-${{ matrix.api }}
          path: smoke-out/
          if-no-files-found: ignore
