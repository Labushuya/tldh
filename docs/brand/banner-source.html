<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:"BGD";src:url(fonts/BricolageGrotesque-96pt-Bold.ttf);font-weight:700}
@font-face{font-family:"BGM";src:url(fonts/BricolageGrotesque-48pt-Medium.ttf);font-weight:500}
@font-face{font-family:"Rob";src:local("Roboto");font-weight:100 900}
html,body{margin:0;background:#08030A}
.b{width:1280px;height:640px;box-sizing:border-box;background:#08030A;color:#FDF7FB;font-family:"Rob",sans-serif;padding:72px 80px 64px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.wm{font-family:"BGD";font-weight:700;font-size:160px;line-height:140px;letter-spacing:-0.035em}
.tag{font-family:"BGM";font-weight:500;font-size:44px;line-height:52px;letter-spacing:-0.015em}
.sub{font-size:22px;line-height:32px;color:#D7B8CA;max-width:700px}
.wave{height:132px;display:flex;align-items:center}
.bars{display:flex;align-items:center;gap:6px}
.bars div{width:4px;border-radius:2px}
.mark{display:flex;align-items:center;gap:16px;margin-left:40px}
.mark div{width:22px;border-radius:11px;background:#D72B84}
</style></head><body>
<div class="b">
 <div style="display:flex;flex-direction:column;gap:14px">
  <span class="wm">tl<span style="color:#D72B84">;</span>dh</span>
  <span class="tag">Long story, short.</span>
  <span class="sub">Sprachnachrichten lesen statt anhören: transkribiert, zusammengefasst und mit Antwortvorschlägen. Offline auf deinem Android-Handy.</span>
 </div>
 <div class="wave"><div class="bars" id="bars"></div>
  <div class="mark"><div style="height:120px"></div><div style="height:80px"></div><div style="height:40px"></div><div style="width:25px;height:25px;border-radius:13px;margin-left:-2px"></div></div>
 </div>
</div>
<script>
const n=94,p=[30,61],el=document.getElementById('bars');
for(let i=0;i<n;i++){let env=1;for(const q of p){const d=Math.abs(i-q);if(d<3)env=Math.min(env,0.12+d*0.22)}
const taper=i>n-16?Math.max(0.1,(n-i)/16):1;const voice=0.3+0.7*Math.abs(Math.sin(i*1.73)*Math.cos(i*0.41+0.6));
const h=Math.round(8+112*env*taper*voice);const d=document.createElement('div');d.style.height=h+'px';d.style.background=i>n-16?'#6F063F':'#4A2140';el.appendChild(d)}
</script></body></html>
